name: quality-gate

# Runs tools/pipeline-check, which runs tools/quality_gate.sh (the same script used on the laptop) once, on every push and pull request.
# CI mode: the checks that need the laptop (sources in other private repos, memory refs) are skipped there.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g elm@0.19.1-6 elm-test@0.19.1-revision12
      - run: cd server && mix deps.get
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pipeline-check
          key: pipeline-check-${{ hashFiles('pipeline-check.version') }}
      # pipeline-check runs tools/quality_gate.sh once, then the fitness checks, and writes report.json (ADR-0005)
      - run: WIKI_GATE_MODE=ci tools/pipeline-check.sh --mode ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: build/pipeline-check/report.json
          retention-days: 14
