name: quality-gate

# Runs tools/quality_gate.sh, the same script used on the laptop, on every push and pull request.
# CI mode: the checks that need the laptop (sources in other private repos, memory refs) are skipped there.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g elm@0.19.1-6 elm-test@0.19.1-revision12
      - run: cd server && mix deps.get
      - run: WIKI_GATE_MODE=ci tools/quality_gate.sh
